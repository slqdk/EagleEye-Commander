<!doctype html><meta charset="utf-8"><title>Galleri</title>
<!-- Sprite sheet for working on the art.  ?p=cartoon  ?d=low  ?o=thin  ?s=96 (pixels per cell)  ?dmg=1|2  ?only=b|u -->
<body style="margin:0;background:#8a9a5b">
<canvas id="c"></canvas>
<script type="module">
import { sprite, TURRET, FRAMES, cameo, setStyle } from './js/toon.js';
import { DEFS } from './shared/defs.js';
const q = new URLSearchParams(location.search), S = +q.get('s') || 64, K = S / 64, dmg = +q.get('dmg') || 0, only = q.get('only');
setStyle({ palette: q.get('p') || 'military', detail: q.get('d') || 'high', outline: q.get('o') || 'thick' });
if (q.get('p') === 'cartoon') document.body.style.background = '#7cc04b';
const cv = document.getElementById('c'); cv.width = 1500 * K; cv.height = (only === 'b' ? 960 : only === 'u' ? 1560 : 2400) * K;
const g = cv.getContext('2d');
const draw = (sp, x, y, k = 1) => g.drawImage(sp.cv, x - sp.ax * k, y - sp.ay * k, sp.cv.width * k, sp.cv.height * k);
const sh = (sp, x, y) => { if (!sp.sh) return; g.globalAlpha = 0.25; g.drawImage(sp.sh.cv, x - sp.sh.ax, y - sp.sh.ay); g.globalAlpha = 1; };
const t0 = performance.now();
let y = 150 * K;
if (only !== 'u') {
  ['A', 'P'].forEach((f, fi) => {
    let x = 120 * K;
    for (const t of Object.keys(DEFS.buildings)) {
      const d = DEFS.buildings[t]; if (!d.f.includes(f)) continue;
      if (x + d.w * S + 20 * K > cv.width) { x = 120 * K; y += 190 * K; }
      const sp = sprite(t, S, { color: fi, faction: f, frame: 1, dmg });
      x += d.w * S / 2; sh(sp, x, y); draw(sp, x, y);
      if (TURRET[t]) draw(sprite(TURRET[t], S, { dir: 3, color: fi, faction: f }), x, y);
      x += d.w * S / 2 + 26 * K;
    }
    y += 270 * K;
  });
  y -= 60 * K;
} else y = 60 * K;
if (only !== 'b') {
  ['A', 'P'].forEach((f, fi) => {
    for (const t of Object.keys(DEFS.units)) {
      const d = DEFS.units[t]; if (!d.f.includes(f) || d.cls === 'inf') continue;
      let x = 70 * K;
      for (let dir = 0; dir < 16; dir += 1) {
        const sp = sprite(t, S, { dir, color: fi + 2, faction: f, frame: dir % 2 });
        sh(sp, x, y); draw(sp, x, y);
        if (TURRET[t]) draw(sprite(TURRET[t], S, { dir: (dir + 2) % 16, color: fi + 2, faction: f }), x, y);
        x += 92 * K;
      }
      y += 112 * K;
    }
  });
  let x = 60 * K;
  ['A', 'P'].forEach((f, fi) => { for (const t of Object.keys(DEFS.units)) { const d = DEFS.units[t]; if (!d.f.includes(f) || d.cls !== 'inf') continue; for (let dir = 0; dir < 8; dir++) { draw(sprite(t, S, { dir, color: fi * 3, faction: f, frame: dir % 3 }), x, y); x += 30 * K; } x += 16 * K; } });
  x = 60 * K; y += 30 * K;
  for (const [t, f] of [['hq','A'],['pow','A'],['pow','P'],['ref','A'],['fac','P'],['rad','A'],['tur','A'],['coil','P'],['mt','A'],['kol','P'],['inf','A'],['flm','P'],['harv','A'],['kat','P']]) { g.drawImage(cameo(t, f, f === 'A' ? 0 : 1), x, y, 96 * K, 72 * K); x += 102 * K; }
}
window.ms = Math.round(performance.now() - t0);
window.done = true;
</script>
